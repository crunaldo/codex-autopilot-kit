<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">Codex Autopilot Kit architecture</title>
  <desc id="desc">A supervisor delegates to explorer, worker, and reviewer roles, then evaluates PASS, FIX, or BLOCKED.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d19"/>
      <stop offset="1" stop-color="#111a34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="610" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="95" r="170" fill="#4f46e5" opacity="0.06"/>
  <circle cx="165" cy="540" r="210" fill="#06b6d4" opacity="0.045"/>

  <text x="64" y="70" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Autopilot architecture</text>
  <text x="64" y="104" fill="#7f8fb8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The supervisor keeps control. Specialized roles stay scoped.</text>

  <g filter="url(#shadow)">
    <rect x="410" y="132" width="460" height="118" rx="22" fill="#141e3b" stroke="#4557a4" stroke-width="2"/>
    <rect x="438" y="158" width="54" height="54" rx="16" fill="url(#accent)"/>
    <path d="M453 185l10 10 18-22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="516" y="180" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">SUPERVISOR</text>
    <text x="516" y="211" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Plan · delegate · evaluate · escalate · stop</text>
    <text x="516" y="235" fill="#6478ad" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">model selected by you</text>
  </g>

  <path d="M640 250V292" stroke="#31416e" stroke-width="3"/>
  <path d="M220 292H1060" stroke="#31416e" stroke-width="3"/>
  <path d="M220 292V326M640 292V326M1060 292V326" stroke="#31416e" stroke-width="3"/>
  <circle cx="640" cy="292" r="6" fill="#06b6d4"/>

  <g filter="url(#shadow)">
    <rect x="70" y="326" width="300" height="158" rx="22" fill="#10182e" stroke="#28365e"/>
    <circle cx="108" cy="365" r="17" fill="#06b6d4" opacity="0.18"/>
    <path d="M101 365h14M108 358v14" stroke="#66d9ef" stroke-width="2.5" stroke-linecap="round"/>
    <text x="137" y="371" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">EXPLORER</text>
    <text x="98" y="413" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Targeted discovery</text>
    <text x="98" y="439" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Repository understanding</text>
    <rect x="98" y="455" width="108" height="25" rx="12" fill="#102a36"/>
    <text x="116" y="473" fill="#72d8e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">READ-ONLY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="326" width="300" height="158" rx="22" fill="#15172f" stroke="#3e4082"/>
    <circle cx="528" cy="365" r="17" fill="#8b5cf6" opacity="0.20"/>
    <path d="M520 370l8-12 8 12" fill="none" stroke="#b7a0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="557" y="371" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">WORKER</text>
    <text x="518" y="413" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Implement · debug</text>
    <text x="518" y="439" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Test · validate</text>
    <rect x="518" y="455" width="96" height="25" rx="12" fill="#2a214d"/>
    <text x="539" y="473" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">WRITES</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="326" width="300" height="158" rx="22" fill="#10182e" stroke="#28365e"/>
    <circle cx="948" cy="365" r="17" fill="#4f46e5" opacity="0.20"/>
    <path d="M940 365l6 6 12-14" fill="none" stroke="#aaa7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="977" y="371" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">REVIEWER</text>
    <text x="938" y="413" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Independent verification</text>
    <text x="938" y="439" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Final quality gate</text>
    <rect x="938" y="455" width="108" height="25" rx="12" fill="#1d214d"/>
    <text x="956" y="473" fill="#b6b4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">READ-ONLY</text>
  </g>

  <path d="M220 484V526H1060V484" fill="none" stroke="#25345c" stroke-width="2"/>
  <path d="M640 484V526" stroke="#25345c" stroke-width="2"/>
  <circle cx="640" cy="526" r="5" fill="#4f46e5"/>

  <g>
    <rect x="390" y="548" width="140" height="36" rx="18" fill="#102a2a" stroke="#225f55"/>
    <text x="435" y="572" fill="#79e2c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">PASS</text>
    <rect x="570" y="548" width="140" height="36" rx="18" fill="#2c2515" stroke="#66552a"/>
    <text x="622" y="572" fill="#f4d06f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">FIX</text>
    <rect x="750" y="548" width="140" height="36" rx="18" fill="#321a29" stroke="#6f3652"/>
    <text x="783" y="572" fill="#f0a4c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">BLOCKED</text>
  </g>
</svg>
