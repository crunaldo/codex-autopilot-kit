name: Release package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      stage_npm:
        description: 'Stage the validated package on npm for human 2FA approval'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Validate package
        run: npm run release:check
      - name: Validate tag against package version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build npm tarball and checksum
        shell: bash
        run: |
          TARBALL=$(npm pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s)[0].filename))")
          sha256sum "$TARBALL" > "$TARBALL.sha256"
      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-autopilot-kit-${{ steps.meta.outputs.version }}
          path: |
            codex-autopilot-kit-*.tgz
            codex-autopilot-kit-*.tgz.sha256

  github-release:
    needs: validate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: codex-autopilot-kit-${{ needs.validate.outputs.version }}
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ needs.validate.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ needs.validate.outputs.tag }}" codex-autopilot-kit-*.tgz codex-autopilot-kit-*.tgz.sha256 --clobber
          else
            gh release create "${{ needs.validate.outputs.tag }}" \
              codex-autopilot-kit-*.tgz \
              codex-autopilot-kit-*.tgz.sha256 \
              --title "Codex Autopilot Kit ${{ needs.validate.outputs.tag }}" \
              --generate-notes
          fi

  npm-stage:
    needs: validate
    if: vars.NPM_STAGE == 'true' || inputs.stage_npm == true
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with staged-publishing support
        shell: bash
        run: |
          npm install --global npm@12.2.0 --prefix "$RUNNER_TEMP/npm-stage-cli"
          echo "$RUNNER_TEMP/npm-stage-cli/bin" >> "$GITHUB_PATH"
      - name: Verify staged-publishing toolchain
        shell: bash
        run: |
          node --version
          npm --version
          npm stage --help >/dev/null
      - name: Stage package with provenance
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
      - name: Human approval required
        run: |
          echo "Package staged successfully."
          echo "Review it with: npm stage list codex-autopilot-kit"
          echo "Approve only after inspection with: npm stage approve <stage-id> --otp <code>"
          echo "This workflow intentionally never runs npm publish or npm stage approve."
