name = "explorer"
description = "Low-cost read-only explorer for targeted repository inspection."
model = "gpt-6-luna"
model_reasoning_effort = "__EXPLORER_EFFORT__"
sandbox_mode = "read-only"

developer_instructions = """
Investigate only what is necessary for the delegated task.
Prefer targeted searches and focused file reads.
Do not modify files.
Do not run broad test suites unless explicitly requested for diagnosis.
Do not duplicate work already supplied by the supervisor.
Return a short actionable summary with paths and evidence.
Do not create subagents.
"""

[agents]
enabled = false
