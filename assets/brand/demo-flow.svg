<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Codex Autopilot Kit quick demo</title>
  <desc id="desc">Three-step terminal-style demo showing install, doctor, and goal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d19"/>
      <stop offset="1" stop-color="#111a34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .pulse2 { animation: pulse 3.6s ease-in-out 1.2s infinite; }
      .pulse3 { animation: pulse 3.6s ease-in-out 2.4s infinite; }
      @keyframes pulse { 0%, 72%, 100% { opacity: .35; } 10%, 35% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1150" cy="70" r="150" fill="#4f46e5" opacity="0.05"/>
  <circle cx="90" cy="520" r="185" fill="#06b6d4" opacity="0.04"/>

  <text x="64" y="70" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">From project to autopilot</text>
  <text x="64" y="104" fill="#7f8fb8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Install. Verify. Start the Goal.</text>

  <path d="M390 287H447" stroke="#31416e" stroke-width="3" stroke-linecap="round"/>
  <path d="M427 277l20 10-20 10" fill="none" stroke="#52669d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M833 287H890" stroke="#31416e" stroke-width="3" stroke-linecap="round"/>
  <path d="M870 277l20 10-20 10" fill="none" stroke="#52669d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="64" y="146" width="326" height="285" rx="22" fill="#0d1428" stroke="#29375f"/>
    <rect x="64" y="146" width="326" height="46" rx="22" fill="#141d36"/>
    <rect x="64" y="170" width="326" height="22" fill="#141d36"/>
    <circle cx="89" cy="169" r="6" fill="#ef6b73"/>
    <circle cx="110" cy="169" r="6" fill="#e9bb62"/>
    <circle cx="131" cy="169" r="6" fill="#67c58a"/>
    <text x="166" y="175" fill="#7f8fb8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">1 · INSTALL</text>

    <text x="87" y="232" fill="#66d9ef" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">$</text>
    <text x="107" y="232" fill="#e5eaff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">npx ... install</text>
    <text x="87" y="271" fill="#6f83b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">profile   balanced</text>
    <text x="87" y="297" fill="#6f83b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">preset    generic</text>
    <text x="87" y="323" fill="#6f83b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">scope     project</text>
    <rect x="87" y="354" width="180" height="35" rx="17" fill="#102a2a" stroke="#225f55"/>
    <circle class="pulse" cx="107" cy="371.5" r="5" fill="#79e2c0"/>
    <text x="121" y="377" fill="#79e2c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">stack installed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="447" y="146" width="386" height="285" rx="22" fill="#0d1428" stroke="#38407b"/>
    <rect x="447" y="146" width="386" height="46" rx="22" fill="#171b38"/>
    <rect x="447" y="170" width="386" height="22" fill="#171b38"/>
    <circle cx="472" cy="169" r="6" fill="#ef6b73"/>
    <circle cx="493" cy="169" r="6" fill="#e9bb62"/>
    <circle cx="514" cy="169" r="6" fill="#67c58a"/>
    <text x="558" y="175" fill="#7f8fb8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">2 · DOCTOR</text>

    <text x="470" y="232" fill="#66d9ef" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">$</text>
    <text x="490" y="232" fill="#e5eaff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">npx ... doctor</text>
    <text x="470" y="272" fill="#79e2c0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">✓ explorer       read-only</text>
    <text x="470" y="298" fill="#79e2c0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">✓ worker         configured</text>
    <text x="470" y="324" fill="#79e2c0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">✓ reviewer       read-only</text>
    <text x="470" y="350" fill="#79e2c0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">✓ manifest       valid</text>
    <rect x="470" y="374" width="199" height="35" rx="17" fill="#202247" stroke="#444d9d"/>
    <circle class="pulse2" cx="490" cy="391.5" r="5" fill="#aaa7ff"/>
    <text x="504" y="397" fill="#c4c2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">autopilot ready</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="146" width="326" height="285" rx="22" fill="#0d1428" stroke="#294566"/>
    <rect x="890" y="146" width="326" height="46" rx="22" fill="#122038"/>
    <rect x="890" y="170" width="326" height="22" fill="#122038"/>
    <circle cx="915" cy="169" r="6" fill="#ef6b73"/>
    <circle cx="936" cy="169" r="6" fill="#e9bb62"/>
    <circle cx="957" cy="169" r="6" fill="#67c58a"/>
    <text x="1001" y="175" fill="#7f8fb8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">3 · GOAL</text>

    <text x="913" y="232" fill="#66d9ef" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">/goal</text>
    <text x="913" y="272" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Read AUTOPILOT-GOAL.md</text>
    <text x="913" y="299" fill="#a8b5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">and complete the objective.</text>
    <text x="913" y="340" fill="#6f83b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">explore → build → review</text>
    <rect x="913" y="374" width="181" height="35" rx="17" fill="#152c3a" stroke="#286078"/>
    <circle class="pulse3" cx="933" cy="391.5" r="5" fill="#66d9ef"/>
    <text x="947" y="397" fill="#8ee7f4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">autonomy starts</text>
  </g>

  <rect x="64" y="475" width="1152" height="2" rx="1" fill="url(#accent)" opacity="0.45"/>
  <text x="64" y="517" fill="#7f8fb8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">No global Codex changes · backups before overwrite · zero package runtime dependencies</text>
</svg>
